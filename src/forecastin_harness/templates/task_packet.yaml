# Canonical task packet schema.
#
# Every field is required unless marked OPTIONAL. The same packet drives
# Claude, Codex, and Gemini prompt rendering — see the sibling
# `<agent>_prompt.md` files under `forecastin_harness/templates/`.
#
# Lists may be either YAML sequences or single strings; a single string is
# treated as a one-element list. The four critical lists (acceptance, tests,
# stop_conditions, evidence) MUST contain at least one entry — the loader
# rejects empty lists outright.

# OPTIONAL: free-form identifier; the harness pre-fills this when rendering
# from a registered lane.
task_id: "FOR-EXAMPLE"

# OPTIONAL: branch and base SHA fill in automatically when rendered against a
# lane. They are present so the prompt never refers to "your branch" without
# naming it explicitly.
branch: "lane/for-example-fix"
base_sha: "0000000000000000000000000000000000000000"

# OPTIONAL: target_repo names the upstream repository the lane operates on
# (e.g. "Oscillate-JP/Forecastin"). worktree is the absolute path to the
# isolated checkout where the agent must run. Both are surfaced in the
# rendered prompt's "Repository identity" section.
target_repo: "Oscillate-JP/Forecastin"
worktree: "/abs/path/to/.harness/worktrees/lane-for-example-fix"

# REQUIRED for `forecastin-harness controller validate` to PASS. These keys
# encode the FOR-220 safety lessons: one objective per lane, an explicit
# wall-clock budget, an unambiguous official gate command, human-only merge
# authority, and an explicit refusal of permission-bypass modes.
#
# lane_type:
#   * feature   — product code (backend/app/, frontend/src/, ...)
#   * gate-fix  — CI / hooks / Makefile / docker / scripts/ci.sh
#   * review    — read-only review work (no code edits)
#   * controller — harness-meta work
# A packet that mixes feature paths and gate-fix paths in files.allowed is
# rejected; split into two PRs.
lane_type: "feature"

# Wall-clock budget for the lane. The supervisor uses this to refuse
# unbounded "stand by" jobs that consume agent context indefinitely.
max_runtime_minutes: 60

# The single, named gate that decides PASS / FAIL for this lane. Ad-hoc
# pytest enumeration must NEVER be confused with this command.
official_gate_command: "bash scripts/ci.sh"

# Diagnostic commands the agent is allowed to run for triage. These are
# documented as diagnostics — they are NOT a substitute for the official
# gate above. Use this list to constrain what counts as "looking around"
# inside a feature lane.
diagnostic_commands_allowed:
  - "git status"
  - "git diff"
  - "ruff check ."
  - "pytest --collect-only"

# Merge authority. The harness will refuse autonomous merges; the operator
# (a human) executes `gh pr merge` after `forecastin-harness pr check`
# returns merge_ready.
merge_authority: "human-only"

# An explicit "do not bypass hooks / permission prompts" affirmation. The
# controller validator rejects any packet that does not set this to true,
# and rejects any packet whose stringy fields contain bypass tokens
# (--no-verify, bypass-permissions, ignore-hooks, ...).
no_bypass_permissions: true

mission: |
  One paragraph. What outcome must exist when the agent stops? Write it so a
  reviewer can read it once and know whether the diff is on-target.

scope: |
  Concrete description of the slice. Be explicit about what is in *and* out.
  An agent will read this twice: once at start, once when checking acceptance.

files:
  allowed:
    - backend/app/api/v1/endpoints/example.py
    - backend/tests/api/v1/endpoints/test_example.py
  forbidden:
    - backend/app/services/_legacy/**
    - frontend/**
    - docs/**

acceptance:
  - "pytest backend/tests/api/v1/endpoints/test_example.py passes"
  - "no import of forbidden modules introduced"
  - "diff is < 200 lines excluding tests"

tests:
  - "cd backend && poetry run pytest backend/tests/api/v1/endpoints/test_example.py -x"

stop_conditions:
  - "all acceptance checks pass on the agent's worktree"
  - "the agent encounters a forbidden-files violation request"
  - "tests cannot be run because of missing fixtures (report and stop)"
  - "any change would touch git config, hooks, or scripts/ci.sh"

evidence:
  - "paste the failing-state command output before the change"
  - "paste the passing-state command output after the change"
  - "list the changed files with sizes"

# REQUIRED. Sub-headings the agent's final report MUST contain. The
# controller validator enforces that the strings 'changed files', 'tests',
# and 'remaining risks' all appear in this list (case-insensitive substring
# match), so the operator always gets the same shape of report back.
final_report:
  - "Summary"
  - "Changed files (paths + one-line rationale per file)"
  - "Tests run (exact commands, tail of output)"
  - "Remaining risks / follow-ups"
